<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — NYDC 2026</title>
    <meta name="description" content="Log in to resume or view your NYDC 2026 registration">
    <link rel="stylesheet" href="css/registration.css">
    <link rel="icon" href="../NYDC-Final-main/images/nydc-logo.png" type="image/png" />
    <style>
        .login-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-card {
            background: rgba(10, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 26, 26, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,26,26,0.5), transparent);
        }
    </style>
</head>
<body>

    <!-- Background Ambience -->
    <div class="bg-ambience"></div>
    <div class="border-frame"></div>
    <div class="grainy-border-left"></div>
    <div class="grainy-border-right"></div>

    <!-- Top Banner -->
    <div class="top-banner">
        <p>NYDC 2026 POWERED BY GENSPARK</p>
    </div>

    <!-- Login Form -->
    <main class="login-wrapper">
        <div class="login-card">

            <!-- Back Link -->
            <a href="../index.html" class="back-link">🏠 Main Page</a>

            <!-- Header -->
            <div class="card-header">
                <span class="card-tag">Welcome Back</span>
                <h1>Log In to <span>NYDC</span></h1>
                <p class="card-subtitle">
                    Resume your registration or view your profile
                </p>
            </div>

            <div class="divider"></div>

            <!-- Form -->
            <form id="login-form">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                        <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                
                <p class="password-error" id="login-error" style="margin-bottom: 20px; text-align: center;"></p>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="login-btn" style="margin-bottom: 20px;">Log In →</button>
            </form>

            <p style="text-align: center; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-muted);">
                Don't have an account? <a href="registration.html" style="color: #8b1a1a; text-decoration: none; font-weight: 600;">Register here</a>
            </p>

        </div>
    </main>

    <!-- Firebase Auth & Login Logic -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js';
      import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js';
      import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: "AIzaSyDBo7RP1PSFhva-Ni0pKScX0MlIuUEAmnE",
        authDomain: "nydc-72b34.firebaseapp.com",
        projectId: "nydc-72b34",
        storageBucket: "nydc-72b34.firebasestorage.app",
        messagingSenderId: "935882112599",
        appId: "1:935882112599:web:f04b660e233f21a46f2d12",
        measurementId: "G-5G8Z44578K"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // Password visibility toggle
      document.querySelector('.password-toggle').addEventListener('click', (e) => {
        const btn = e.currentTarget;
        const input = document.getElementById('password');
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.querySelector('.eye-icon').style.display = isPassword ? 'none' : 'block';
        btn.querySelector('.eye-off-icon').style.display = isPassword ? 'block' : 'none';
      });

      // Handle Login
      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          const uid = cred.user.uid;

          // Find registration doc
          const q = query(collection(db, 'registrations'), where('uid', '==', uid));
          const snapshot = await getDocs(q);

          if (snapshot.empty) {
            // Very rare: auth account exists but no firestore doc
            errorEl.textContent = 'No registration found. Please register.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In →';
            return;
          }

          const docSnap = snapshot.docs[0];
          const data = docSnap.data();

          if (data.status === 'draft') {
            // Restore session storage and drop them at events page to complete selection
            sessionStorage.setItem('nydc_registration', JSON.stringify({
              uid: data.uid,
              firstName: data.firstName,
              lastName: data.lastName,
              email: data.email,
              phone: data.phone,
              school: data.school,
              grade: data.grade,
              city: data.city
            }));
            sessionStorage.setItem('nydc_doc_id', docSnap.id);
            window.location.href = 'event.html';
          } else {
            // Pending, Approved, or Rejected - Registration is already complete
            window.location.href = 'profile.html';
          }

        } catch (err) {
            console.error(err);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In →';
            if (err.code === 'auth/invalid-credential') {
                errorEl.textContent = 'Invalid email or password.';
            } else {
                errorEl.textContent = 'Error logging in. Try again.';
            }
        }
      });
    </script>
</body>
</html>
